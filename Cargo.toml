[package]
name = "easy-move-resize-win"
version = "0.1.0"
edition = "2021"
description = "Move and resize windows by holding a modifier key and dragging anywhere in the window (Windows port of dmarcotte/easy-move-resize)"
license = "MIT"

[[bin]]
name = "easy-move-resize"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
